@if (shouldShow()) {
  <div class="relative z-40">
    <button
      type="button"
      class="flex h-12 w-12 items-center justify-center rounded-full bg-primary shadow-lg transition-transform hover:scale-105"
      [attr.aria-label]="panelLabel()"
      (click)="togglePanel()"
    >
      <svg lucideFolderOpen class="h-6 w-6 text-primary-content"></svg>
    </button>

    @if (isOpen()) {
      <div
        class="absolute right-14 top-0 min-w-[180px] max-w-[280px] rounded-lg bg-base-100 p-2 shadow-xl"
        style="border: 2px solid oklch(var(--p));"
      >
        <div class="mb-2 border-b border-base-300 px-2 pb-2">
          <div class="mb-1 text-[10px] font-semibold uppercase tracking-wide text-base-content/70">
            Navigazione gruppi
          </div>
          <input
            type="text"
            class="input input-bordered input-xs w-full"
            [value]="searchQuery()"
            (input)="searchQuery.set($any($event.target).value)"
            placeholder="Cerca sessione..."
            aria-label="Cerca sessione"
          />
        </div>

        <div class="max-h-[60vh] space-y-1 overflow-y-auto">
          @for (section of filteredSections(); track section.id) {
            <div class="overflow-hidden rounded-md border border-base-300">
              <button
                type="button"
                class="flex w-full items-center justify-between bg-base-200 px-2 py-1.5 text-left text-xs transition-colors hover:bg-base-300"
                (click)="toggleGroup(section.id)"
              >
                <span class="truncate font-semibold">
                  {{ section.name }}
                  @if (section.isCurrent) {
                    <span class="badge badge-primary badge-xs ms-1">Corrente</span>
                  } @else {
                    <span class="badge badge-xs ms-1 border-orange-500 bg-orange-500 text-white">Globale</span>
                  }
                </span>
                <span class="opacity-70">{{ isGroupExpanded(section.id) ? '−' : '+' }}</span>
              </button>

              @if (isGroupExpanded(section.id)) {
                <div class="bg-base-100 p-1">
                  @for (session of section.sessions; track session.id) {
                    <button
                      type="button"
                      class="flex w-full items-center gap-1 rounded-md px-2 py-1.5 text-left text-xs transition-colors hover:bg-base-200"
                      (click)="navigateToSession(session.id)"
                    >
                      @if (session.isFavorite) {
                        <span class="text-error">★</span>
                      }
                      <span class="truncate">{{ session.title || 'Senza titolo' }}</span>
                    </button>
                  }
                </div>
              }
            </div>
          }

          @if (filteredSections().length === 0) {
            <div class="px-2 py-2 text-xs text-base-content/60">
              Nessun risultato per la ricerca corrente.
            </div>
          }
        </div>
      </div>
    }
  </div>
}
